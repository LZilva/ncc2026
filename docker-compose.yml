services:
  mysql:
    image: mysql:8.0
    container_name: gscomp381-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vehicle_db
      MYSQL_USER: gscomp381
      MYSQL_PASSWORD: gscomp381
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build:
      context: ./app
    container_name: node-app
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: gscomp381
      DB_PASSWORD: gscomp381
      DB_NAME: vehicle_db
    ports:
      - "3000:3000"

volumes:
  mysql_data:
